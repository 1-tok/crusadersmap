name: Rebuild latest Crusader map composite

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rebuild-current-map.yml'
      - 'tools/rebuild_city_coastal_qa.py'
      - 'tools/reconcile_intake_geography.py'
      - 'tools/activate_review_coastal_sprites.py'
      - 'tools/activate_greece_egypt_review_sprites.py'
      - 'tools/activate_uploaded_coastal_city_sheets.py'
      - 'tools/reconcile_recovered_coasts_islands.py'
      - 'data/manifests/ROOT-ZIP-RECOVERY-2026-11-13.json'
      - 'data/sprites/automated-intake/manifest.json'
      - 'build_stage1.py'
      - 'build_stage2.py'
      - 'tools/render_aegean_ionian_island_proof.py'
      - 'tools/render_all_island_placements_review.py'
      - 'data/manifests/GREEK-ISLANDS-ALL-ORPHAN-SELECTED-REVIEW-2026-11-15.json'
      - 'placer.py'
      - 'terrainsp.py'
      - 'build_fallback_assets.py'
      - 'tools/import_recent_terrain_zips.py'
      - 'make_registers.py'
      - 'tools/check_terrain_gap_consistency.py'
      - 'tools/coverage_underlays.py'
      - 'tools/audit_lowland_51_cutouts.py'
      - 'tools/lowland_51_review_placer.py'
      - 'tools/check_lowland_51_review.py'
      - 'tools/compare_lowland_coasts.py'
      - 'data/manifests/LOWLAND-51-CANONICAL-PLACEMENT-AUDIT-2026-11-15.json'
      - 'tools/check_coverage_underlays.py'
      - 'assets/terrain/large_area/rect_underlays_04/**'
      - 'tools/report_map_sprite_utilization.py'
      - 'tools/audit_intake_promotion.py'
      - 'build_generic_assets.py'
      - 'build_sprite_assets.py'
      - 'places.py'
      - 'data/sprites/placements-geographic-recovery-1095-1571.json'
      - 'tools/check_geographic_castle_placements.py'
      - 'data/manifests/automated-intake-stable-scatter-classes.json'
      - 'terrain.py'
      - 'tools/draw_nile_ecology_pack.py'
      - 'tools/draw_nile_field_stretches.py'
      - 'tools/place_approved_nile_painting.py'
      - 'data/sprites/nile-painted-modular-2026-11-17-v2/**'
      - 'reports/egypt-nile-painted-modular-review/geographic-fit-v2-qa.json'
      - 'tools/install_nile_ecology_pack.py'
      - 'tools/build_nile_derived_sprite_fallback.py'
      - 'tools/review_full_nile_inset.py'
      - 'tools/review_nile_two_banks_actual_atlas.py'
      - 'tools/review_nile_full_corridor_variety.py'
      - 'tools/review_eight_joined_nile_on_print.py'
      - 'data/sprites/nile-joins-batch-02/**'
      - 'assets/sprites/incoming/nile-joins-batch-02/**'
      - 'assets/sprites/incoming/nile_joins_batch_02*.zip'
      - 'assets/sprites/incoming/nile_delta_upstream_terrain_sprites_2026-11-17.zip'
      - 'data/sprites/nile-ecology-2026-11-17/**'
      - 'tools/fetch_nile_delta_waterways.py'
      - 'tools/render_nile_delta_waterways.py'
      - 'tools/nile_delta_terrain_policy.py'
      - 'data/sprites/terrain-batch05/manifest.json'
      - 'data/sprites/terrain-batch06/manifest.json'
      - 'tools/draw_nile_delta_wetlands.py'
      - 'sea.py'
      - 'water_palette.py'
      - 'sprites.py'
      - 'assets/sprites/water-masks/**'
      - 'tools/preview_azure_harbor_masks.py'

permissions:
  contents: write

concurrency:
  group: map-rebuild-main
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Graphics libraries and fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libcairo2-dev pkg-config fontconfig
          mkdir -p "$HOME/.local/share/fonts"
          curl --fail --location --silent --show-error --retry 3 \
            https://raw.githubusercontent.com/google/fonts/main/ofl/unifrakturcook/UnifrakturCook-Bold.ttf \
            --output "$HOME/.local/share/fonts/UnifrakturCook-Bold.ttf"
          test -s "$HOME/.local/share/fonts/UnifrakturCook-Bold.ttf"
          fc-cache -f "$HOME/.local/share/fonts"
          fc-match -f '%{family}\n' 'UnifrakturCook' | grep -qi 'UnifrakturCook'
          python -m pip install --upgrade pip
          python -m pip install numpy Pillow scipy scikit-image shapely pyproj pycairo
      - name: Acquire real meandering Nile Delta river geometries for geographic review
        run: |
          python -m py_compile tools/fetch_nile_delta_waterways.py tools/render_nile_delta_waterways.py terrain.py build_stage2.py
          python tools/fetch_nile_delta_waterways.py
      - name: Regenerate current inventory and select latest located artwork
        run: |
          mkdir -p out deliver reports/rebuild-2026-11-12
          cp reports/rebuild-2026-11-12/outremer-current-composite.jpg out/coverage-before.jpg
          python -m py_compile tools/audit_lowland_51_cutouts.py tools/lowland_51_review_placer.py tools/check_lowland_51_review.py tools/compare_lowland_coasts.py
          python -m py_compile terrain.py tools/draw_nile_delta_wetlands.py tools/nile_delta_terrain_policy.py build_stage2.py
          python tools/nile_delta_terrain_policy.py
          python -m py_compile tools/install_nile_ecology_pack.py tools/draw_nile_ecology_pack.py tools/draw_nile_field_stretches.py tools/place_approved_nile_painting.py
          python tools/install_nile_ecology_pack.py
          python -m py_compile tools/build_nile_derived_sprite_fallback.py
          python tools/build_nile_derived_sprite_fallback.py
          python tools/audit_lowland_51_cutouts.py
          python tools/build_sprite_handoff.py
          # build_sprite_assets.py recreates assets/sprites/; preserve source ZIPs first.
          mkdir -p out/coastal-sheet-source out/egypt-review-source
          cp assets/sprites/qa_provisional/coastal-batch05-2026-11-16/alexandria-coastal-city-2026-11-16-review.png out/egypt-review-source/
          cp assets/sprites/qa_provisional/coastal-batch05-2026-11-16/damietta-coastal-city-2026-11-16-review.png out/egypt-review-source/
          cp assets/sprites/incoming/crusader_southern_coast_ACTUAL_spritesheet.zip out/coastal-sheet-source/
          cp assets/sprites/incoming/crusader_northern_coast_ACTUAL_spritesheet.zip out/coastal-sheet-source/
          python build_sprite_assets.py "$PWD"
          python build_generic_assets.py "$PWD"
          python tools/import_recent_terrain_zips.py
          python build_fallback_assets.py
          python tools/activate_review_coastal_sprites.py
          python tools/activate_uploaded_coastal_city_sheets.py
          python tools/activate_greece_egypt_review_sprites.py
          python - <<'PY'
          import json
          from pathlib import Path
          registry = json.loads(Path('assets/sprites.json').read_text())
          for site in ('alexandria', 'damietta'):
              selected = [r for r in registry if r.get('site') == site and r.get('cat') == 'city']
              assert len(selected) == 1, (site, 'missing or duplicate city records')
              record = selected[0]
              assert record.get('source') == 'greece-egypt-review-assumed-coast-2026-11-17', (site, record.get('source'))
              assert (Path('assets/sprites') / record['file']).is_file(), (site, 'missing working sprite')
              print('EGYPT REVIEW SELECTED:', site, record['file'])
          import placer
          for site in ('alexandria', 'damietta'):
              records = [r for r in registry if r.get('site') == site]
              site_record = records[0]
              matches = [p for p in placer.PL.PLACES if p[0] == site_record['region']
                         and placer.SP.MATCH.get(p[5], {}).get('site') == site]
              assert matches, (site, 'no actual map place matched')
              assert not any(placer.coastal_sprite_held(p[0], p[5], p[7]) for p in matches), (site, 'still held')
              print('EGYPT REVIEW RENDERABLE:', site, len(matches), 'map place(s)')
          PY
          python tools/rebuild_city_coastal_qa.py
          python tools/reconcile_intake_geography.py
      - name: Prepare reproducible Mediterranean azure harbor masks
        env:
          MEDITERRANEAN_AZURE_WASH: '1'
        run: |
          python tools/preview_azure_harbor_masks.py
          cp reports/azure-water-qa/provisional-water-mask-report.json reports/rebuild-2026-11-12/harbor-water-mask-report.json
      - name: Render actual current map from geographic sources
        env:
          MEDITERRANEAN_AZURE_WASH: '1'
        run: |
          python build_stage2.py 0.30 colour
          cp out/stage2-colour.jpg reports/rebuild-2026-11-12/outremer-current-composite.jpg
          cp out/underlay-coverage-report.json reports/rebuild-2026-11-12/underlay-coverage-report.json
          python tools/check_coverage_underlays.py
          python tools/check_lowland_51_review.py
          python tools/compare_lowland_coasts.py
          python tools/review_full_nile_inset.py
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("reports/rebuild-2026-11-12/nile-painted-production-placement.json")
          q=json.loads(p.read_text())
          assert q["status"]=="production_atlas_painted_section_active"
          assert q["panel_count"]==4 and q["pixel_exact_original_source_seams"]
          assert not q["rotation_degrees"] and not q["mirrored"] and not q["nonuniform_distortion"]
          assert q["visible_pixels_alpha_gt_0_1"]>15000
          assert q["upstream_and_delta_extensions"]=="not yet painted or connected"
          print("PAINTED NILE PRODUCTION SECTION VERIFIED:",q)
          PY
      - name: Review Nile bank art against actual updated atlas (zero rotation)
        run: python tools/review_nile_two_banks_actual_atlas.py
      # Disabled 2026-11-19: owner rejected Nile floodplain cutouts.
      # The experimental renderer placed field art into desert and at an
      # inappropriate print scale. Do not regenerate or publish its previews.
      # Preserve underlying sprite source assets and approved four-panel art.
      - name: Review eight joined Nile sprites on actual print canvas when binaries exist
        run: python tools/review_eight_joined_nile_on_print.py
      - name: Stage reconstructed original Nile PNGs as review-only repository assets
        run: |
          if test -f out/nile-batch02-review-input/nile_joins_01.png; then
            mkdir -p data/sprites/nile-joins-batch-02
            cp out/nile-batch02-review-input/nile_joins_*.png data/sprites/nile-joins-batch-02/
            echo "Eight SHA-verified original Nile tiles staged for review, not activated."
          else
            echo "No new eight-tile source data: leaving reviewed assets untouched."
          fi
      - name: Update Canaan geographic review from actual rebuilt map
        run: python tools/build_canaan_map_review.py
      - name: Generate new coverage and asset-usage registers
        run: |
          mkdir -p deliver
          python make_registers.py "$PWD"
          cp deliver/site-coverage-register.csv reports/rebuild-2026-11-12/
          cp deliver/image-usage-and-off-map-list.csv reports/rebuild-2026-11-12/
          cp deliver/terrain-gap-report.md reports/rebuild-2026-11-12/
          cp deliver/terrain-gap-cells.csv reports/rebuild-2026-11-12/
          python tools/check_terrain_gap_consistency.py
          python tools/report_map_sprite_utilization.py
          python tools/audit_intake_promotion.py
          python tools/check_geographic_castle_placements.py
      - name: Reconcile recovered Greek island and coastal city art; render review composite
        run: python tools/reconcile_recovered_coasts_islands.py
      - name: Render separate Aegean and Ionian painted-island reviews
        run: python tools/render_aegean_ionian_island_proof.py
      - name: Render all new Aegean and Ionian island paintings for visual approval
        run: python tools/render_all_island_placements_review.py
      - name: Upload build outputs for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: latest-crusader-composite-and-QA
          path: |
            reports/rebuild-2026-11-12/
            reports/nile-two-bank-target-review/
            reports/nile-full-corridor-review/
            reports/nile-joined-eight-print-review/
            reports/azure-water-qa/
            reports/lowland-review-2026-11-15/
            reports/nile-delta-terrain-review-2026-11-17/
            reports/nile-delta-hydrography-review-2026-11-17/
            reports/nile-delta-terrain-review-2026-11-17/painted-pack-placement.json
            reports/nile-delta-terrain-review-2026-11-17/derived-art-generation.json
            reports/island-review-2026-11-15/
            out/underlay-coverage-report.json
            out/placement_log.json
            out/usage.json
          if-no-files-found: warn
      - name: Commit latest composite and QA registers to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Uploads and other GitHub Actions may advance main while rendering.
          # Keep generated review files in the working tree and rebuild the
          # report-only commit atop the current remote tip before pushing.
          for attempt in 1 2 3 4; do
            git fetch origin main
            git reset --mixed origin/main
            git add reports/nile-joined-eight-print-review/ reports/nile-full-corridor-review/ reports/nile-two-bank-target-review/ reports/rebuild-2026-11-12/ reports/island-review-2026-11-15/ reports/lowland-review-2026-11-15/ reports/nile-delta-terrain-review-2026-11-17/ reports/nile-delta-hydrography-review-2026-11-17/
            if [ -d data/sprites/nile-joins-batch-02 ]; then
              git add data/sprites/nile-joins-batch-02/
            fi
            if [ -d data/sprites/nile-ecology-2026-11-17 ]; then
              git add data/sprites/nile-ecology-2026-11-17/
            fi
            if git diff --cached --quiet; then
              echo "Reports already match current main"
              exit 0
            fi
            git commit -m "build: refresh full atlas and sprite usage review [skip ci]"
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Main advanced during push (attempt ${attempt}); retrying"
          done
          exit 1

# Requested full atlas review rebuild on 2026-11-12; retain review-only QA gates.
