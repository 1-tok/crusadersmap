name: Egypt inset painted river corridor proof
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/egypt-inset-painted-proof.yml'
      - 'tools/build_egypt_inset_painted_proof.py'
permissions:
  contents: write
concurrency:
  group: egypt-inset-illustrated-proof
  cancel-in-progress: true
jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Cairo and geometry libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libcairo2-dev pkg-config
          python -m pip install --quiet numpy pillow shapely pyproj pycairo scipy scikit-image
      - name: Render Egypt-only enlarged geographic Nile corridor
        run: |
          python -m py_compile tools/build_egypt_inset_painted_proof.py
          python tools/build_egypt_inset_painted_proof.py
          python - <<'PY'
          import json
          from pathlib import Path
          from PIL import Image
          p=Path("reports/egypt-inset-corridor-review-2026-11-17")
          qa=json.loads((p/"egypt-inset-proof-qa.json").read_text())
          assert qa["fields"]>=120 and qa["boats"]>=8 and qa["villages"]>=8,qa
          assert sum(qa["segments"].values())>5,qa["segments"]
          with Image.open(p/"egypt-inset-illustrated-river-proof.jpg") as img:
              assert img.width>2000 and img.height>1500,img.size
          for part in ("valley","cairo","delta"):
              assert (p/f"egypt-{part}-detail.jpg").is_file()
          print("EGYPT INSET PAINTED PROOF VALIDATED:",qa)
          PY
      - name: Commit independent proof, never alter atlas composite
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/egypt-inset-corridor-review-2026-11-17/
          git diff --cached --quiet && exit 0
          git commit -m "review: publish enlarged Egypt Nile corridor with riverboats villages and fields [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: egypt-inset-painted-river-corridor
          path: reports/egypt-inset-corridor-review-2026-11-17/
          if-no-files-found: warn
