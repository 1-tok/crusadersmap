name: 1180 integrated sprite proof

on:
  workflow_dispatch:
  push:
    paths:
      - tools/render_1180_integrated_proof.py
      - data/sprites/placements-review-1180.geojson
      - data/sprites/placements-1180.geojson
      - .github/workflows/1180-integrated-proof.yml

permissions:
  contents: write

jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout map repository
        uses: actions/checkout@v4
      - name: Python runtime
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Dependencies
        run: python -m pip install Pillow pyproj
      - name: Build strictly date-gated visual proof
        run: python tools/render_1180_integrated_proof.py --year 1180 --width 2700
      - name: Upload diagnostic proof and QA manifest
        uses: actions/upload-artifact@v4
        with:
          name: crusader-1180-integrated-review-proof
          path: |
            previews/crusader-1180-integrated-review-proof.jpg
            previews/crusader-1180-integrated-review-proof.json
          if-no-files-found: error
      - name: Commit generated review proof to main
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add previews/crusader-1180-integrated-review-proof.jpg previews/crusader-1180-integrated-review-proof.json
          if ! git diff --cached --quiet; then
            git commit -m "build: refresh 1180 integrated sprite review proof [skip ci]"
            git push
          fi
