name: Coastal city batch 05 comparison QA
on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/review_coastal_city_batch05.py'
      - 'data/manifests/coastal-city-batch05-regenerated-2026-11-16.json'
      - 'assets/sprites/qa_provisional/coastal-batch05-2026-11-16/**'
      - '.github/workflows/coastal-city-batch05-review.yml'
jobs:
  artwork-comparison:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install Pillow
      - name: Compare original selected city artwork with six provisional candidates
        run: python tools/review_coastal_city_batch05.py
      - uses: actions/upload-artifact@v4
        with:
          name: coastal-city-batch05-old-vs-new-review
          path: |
            reports/coastal-city-batch05-2026-11-16/old-vs-new-six-city-contact-sheet.jpg
            reports/coastal-city-batch05-2026-11-16/placement-gate.json
          if-no-files-found: error
