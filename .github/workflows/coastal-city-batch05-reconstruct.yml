name: Reconstitute six painted coastal-city sprites (Batch 05)
on:
  push:
    branches:
      - intake/coastal-city-batch05-regenerated-2026-11-16
    paths:
      - 'assets/sprites/incoming/coastal-batch05-chunks-2026-11-16/**'
      - 'data/manifests/coastal-city-batch05-regenerated-2026-11-16.json'
      - 'tools/reconstruct_coastal_city_batch05.py'
      - '.github/workflows/coastal-city-batch05-reconstruct.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  reconstruct:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'Pillow>=10,<12'
      - name: Rebuild PNG bytes and validate hashes alpha and dimensions
        run: python tools/reconstruct_coastal_city_batch05.py
      - name: Commit verified original PNGs and remove temporary transport parts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/sprites/qa_provisional/coastal-batch05-2026-11-16 reports/coastal-city-batch05-2026-11-16/reconstruction-qa.json
          git rm -r assets/sprites/incoming/coastal-batch05-chunks-2026-11-16
          git commit -m "Add six byte-verified painted coastal city PNGs for placement review"
          git push origin HEAD:intake/coastal-city-batch05-regenerated-2026-11-16
