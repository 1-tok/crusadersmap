name: Coastal lowland cutout preflight

on:
  pull_request:
    paths:
      - 'tools/audit_lowland_51_cutouts.py'
      - 'tools/lowland_51_review_placer.py'
      - 'tools/check_lowland_51_review.py'
      - 'tools/compare_lowland_coasts.py'
      - 'terrain.py'
      - 'tools/coverage_underlays.py'
      - 'build_stage2.py'
      - '.github/workflows/coastal-lowland-preflight.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect-lowlands:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install image QA packages
        run: python -m pip install Pillow numpy
      - name: Validate Python source
        run: |
          python -m py_compile tools/audit_lowland_51_cutouts.py tools/lowland_51_review_placer.py tools/check_lowland_51_review.py tools/compare_lowland_coasts.py tools/coverage_underlays.py terrain.py build_stage2.py
      - name: Decode and inspect 51 actual canonical PNGs
        run: python tools/audit_lowland_51_cutouts.py
      - name: Upload full contact sheet and per-image QA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coastal-lowland-51-preflight
          path: reports/lowland-review-2026-11-15/
          if-no-files-found: warn
