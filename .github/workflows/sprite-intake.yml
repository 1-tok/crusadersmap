name: Sprite intake
on:
  push:
    branches: [main]
    paths:
      - 'assets/sprites/incoming/**'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: sprite-intake-main
  cancel-in-progress: false
jobs:
  process:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-sprite-intake.txt
      - run: pip install -r requirements-sprite-intake.txt
      - name: Validate and register PNGs
        run: python tools/sprite_intake.py
      - name: Validate intake unit tests
        run: python -m unittest discover -s tests -p 'test_sprite_intake.py' -v
      - name: Commit outputs (never originals)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/sprites/automated-intake data/sprites/catalog.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(sprites): catalog incoming PNG sprites [skip ci]"
            git push origin HEAD:main
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sprite-intake-report
          path: data/sprites/automated-intake/processing-report.json
          if-no-files-found: warn
