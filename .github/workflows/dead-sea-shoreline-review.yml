name: Dead Sea shoreline map-scale review
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tools/build_dead_sea_shoreline_review.py'
      - '.github/workflows/dead-sea-shoreline-review.yml'
      - 'reports/rebuild-2026-11-12/outremer-current-composite.jpg'
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install Pillow pyproj
      - name: Crop actual atlas around Dead Sea and Jordan river inlet
        run: python tools/build_dead_sea_shoreline_review.py
      - uses: actions/upload-artifact@v4
        with:
          name: dead-sea-shoreline-qa-crop
          path: reports/dead-sea-review/
      - name: Commit inspection images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --mixed origin/main
            git add reports/dead-sea-review/
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "qa: publish Dead Sea map-scale crop [skip ci]"
            if git push origin HEAD:main; then exit 0; fi
          done
          exit 1
